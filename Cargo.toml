[workspace]
members = ["crates/k-git", "crates/k-syntax", "crates/k-buffer", "crates/k-terminal"]
resolver = "2"

[package]
name = "k-code"
version = "0.1.0"
edition = "2021"

[dependencies]
k-git = { path = "crates/k-git" }
k-syntax = { path = "crates/k-syntax" }
k-buffer = { path = "crates/k-buffer" }
k-terminal = { path = "crates/k-terminal" }

ratatui = { version = "0.29", features = ["crossterm"] }
crossterm = { version = "0.28", features = ["event-stream"] }
tokio = { version = "1", features = ["full"] }
ignore = "0.4"
walkdir = "2"
dirs = "6"
fuzzy-matcher = "0.3"
serde = { version = "1", features = ["derive"] }
toml = "0.8"
unicode-width = "0.2"
unicode-segmentation = "1"
color-eyre = "0.6"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = "0.3"
tracing-appender = "0.2"
clap = { version = "4", features = ["derive"] }
futures = "0.3"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
